<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kinda">
  <defs>
    <linearGradient id="kinda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#ffc24a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#kinda)"/>
  <!-- Lowercase "k" drawn as strokes so it never depends on an installed font. -->
